<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Órdenes de Servicio - Mexus Hospitalaria</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container py-5">
        <header class="pb-3 mb-4 border-bottom d-flex justify-content-between align-items-center">
            <div>
                <h1 class="h3 fw-bold text-dark">📋 Mexus Hospitalaria - Órdenes de Servicio</h1>
                <p class="text-muted m-0">Sistema digital de control y seguimiento de servicios técnicos</p>
            </div>
            <div>
                <button class="btn btn-primary btn-sm me-2" onclick="abrirModalNuevaOrden()">➕ Nueva Orden de Servicio</button>
                <button class="btn btn-outline-secondary btn-sm" onclick="cargarOrdenes()">🔄 Refrescar</button>
            </div>
        </header>

        <div class="card shadow-sm">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-dark">
                            <tr>
                                <th>Folio</th>
                                <th>Fecha</th>
                                <th>Motivo</th>
                                <th>Unidad Médica / Hospital</th>
                                <th>Equipo / Modelo</th>
                                <th>Estado</th>
                                <th class="text-end">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-ordenes">
                            <!-- Dinámico -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal para Nueva Orden -->
    <div class="modal fade" id="modalNuevaOrden" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header bg-dark text-white">
                    <h5 class="modal-title">Nueva Orden de Servicio</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="form-orden">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label fw-bold">No. de Folio</label>
                                <input type="number" class="form-control" id="folio" required value="1002">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Motivo de la Visita</label>
                                <select class="form-select" id="motivo">
                                    <option value="Apertura">Apertura</option>
                                    <option value="Instalación">Instalación</option>
                                    <option value="Capacitación">Capacitación</option>
                                    <option value="Mtto. Preventivo">Mtto. Preventivo</option>
                                    <option value="Mtto. Correctivo">Mtto. Correctivo</option>
                                </select>
                            </div>

                            <hr class="my-3">
                            <h6 class="text-primary fw-bold">Datos de la Unidad Médica</h6>

                            <div class="col-md-12">
                                <label class="form-label">Nombre de la Unidad Médica</label>
                                <input type="text" class="form-control" id="unidad" required placeholder="Ej. Hospital General">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Dirección</label>
                                <input type="text" class="form-control" id="direccion">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Ubicación / Área</label>
                                <input type="text" class="form-control" id="ubicacion" placeholder="Ej. Terapia Intensiva">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Contacto</label>
                                <input type="text" class="form-control" id="contacto">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">No. de Contrato</label>
                                <input type="text" class="form-control" id="contrato">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Tiempo de Garantía</label>
                                <input type="text" class="form-control" id="garantia">
                            </div>

                            <hr class="my-3">
                            <h6 class="text-primary fw-bold">Información del Equipo</h6>

                            <div class="col-md-4">
                                <label class="form-label">Equipo</label>
                                <input type="text" class="form-control" id="equipo" required placeholder="Ej. Ultrasonido">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Marca</label>
                                <input type="text" class="form-control" id="marca">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Modelo</label>
                                <input type="text" class="form-control" id="modelo">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">No. de Serie</label>
                                <input type="text" class="form-control" id="serie">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">No. de Inventario</label>
                                <input type="text" class="form-control" id="inventario">
                            </div>

                            <hr class="my-3">
                            <h6 class="text-primary fw-bold">Observaciones y Firmas</h6>

                            <div class="col-md-12">
                                <label class="form-label">Observaciones Generales</label>
                                <textarea class="form-control" id="observaciones" rows="2"></textarea>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Técnico de Servicio</label>
                                <input type="text" class="form-control" id="tecnico" placeholder="Nombre del técnico">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Responsable de la Unidad</label>
                                <input type="text" class="form-control" id="responsable" placeholder="Nombre del responsable">
                            </div>
                        </div>

                        <button type="submit" class="btn btn-success w-100 mt-4">Guardar Orden de Servicio en SQL</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let modalOrdenInstance = null;

        document.addEventListener('DOMContentLoaded', () => {
            modalOrdenInstance = new bootstrap.Modal(document.getElementById('modalNuevaOrden'));
            cargarOrdenes();
            document.getElementById('form-orden').addEventListener('submit', registrarOrden);
        });

        async function cargarOrdenes() {
            try {
                const response = await fetch('/api/ordenes');
                const ordenes = await response.json();
                const tbody = document.getElementById('tabla-ordenes');
                tbody.innerHTML = '';

                if (ordenes.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="7" class="text-center py-4 text-muted">No hay órdenes de servicio registradas.</td></tr>`;
                    return;
                }

                ordenes.forEach(ord => {
                    const fecha = ord.fecha ? new Date(ord.fecha).toLocaleDateString() : 'N/A';
                    tbody.innerHTML += `
                        <tr>
                            <td><span class="fw-bold text-primary">#${ord.folio_orden}</span></td>
                            <td>${fecha}</td>
                            <td><span class="badge bg-info text-dark">${ord.motivo_servicio}</span></td>
                            <td>${ord.nombre_unidad_medica}</td>
                            <td>${ord.equipo} (${ord.modelo || 'N/A'})</td>
                            <td><span class="badge bg-success">${ord.estado_orden || 'Abierta'}</span></td>
                            <td class="text-end">
                                <button class="btn btn-sm btn-outline-secondary" onclick="alert('Folio: ${ord.folio_orden}\\nUnidad: ${ord.nombre_unidad_medica}')">Ver Detalle</button>
                            </td>
                        </tr>
                    `;
                });
            } catch (error) {
                console.error('Error al cargar órdenes:', error);
            }
        }

        function abrirModalNuevaOrden() {
            document.getElementById('form-orden').reset();
            modalOrdenInstance.show();
        }

        async function registrarOrden(e) {
    e.preventDefault();
    const data = {
        folio_orden: document.getElementById('folio').value,
        motivo_servicio: document.getElementById('motivo').value,
        nombre_unidad_medica: document.getElementById('unidad').value,
        direccion: document.getElementById('direccion').value,
        ubicacion: document.getElementById('ubicacion').value,
        contacto: document.getElementById('contacto').value,
        no_contrato: document.getElementById('contrato').value,
        tiempo_garantia: document.getElementById('garantia').value,
        equipo: document.getElementById('equipo').value,
        marca: document.getElementById('marca').value,
        modelo: document.getElementById('modelo').value,
        serie: document.getElementById('serie').value,
        inventario: document.getElementById('inventario').value,
        observaciones: document.getElementById('observaciones').value,
        tecnico_servicio: document.getElementById('tecnico').value,
        responsable_unidad: document.getElementById('responsable').value
    };

    try {
        const response = await fetch('/api/ordenes', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });

        if (response.ok) {
            modalOrdenInstance.hide();
            cargarOrdenes();
        } else {
            const err = await response.json();
            alert('Error: ' + (err.error || 'No se pudo guardar'));
        }
    } catch (error) {
        console.error('Error:', error);
        alert('Error de red al guardar la orden');
    }
}
    </script>
</body>
</html>
